<meta charset="UTF-8">

<title>Career Vision Hub — Your Route After 10th Class</title>

<style>

    --paper:#EEE8D6;
    --paper-deep:#E3DBC3;
    --ink:#2A2318;
    --ink-soft:#5B5342;
    --card:#F7F3E7;
    --line-mpc:#C97F2E;
    --line-bipc:#A2402F;
    --line-cec:#33566B;
    --line-hec:#4B6B3A;
    --line-mec:#6E4A80;
    --line-poly:#2E7D6B;
    --line-iti:#7A5230;
    --line-vocational:#4E6F7A;
    --line-skilldev:#9C3F63;
    --line-defence:#37465A;
    --line-govtjobs:#6B6B34;
    --rail:#D3C9A9;
    --shadow: 0 1px 0 rgba(42,35,24,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.02em;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  #app{max-width:1200px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--rail);
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    flex-wrap:nowrap;
  }
  header.topbar .brand{
    margin:0;
    font-weight:700;font-size:1rem;
    display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;
    border:1px solid var(--ink);
    background:var(--card);
    border-radius:8px;
    padding:9px 13px;
    box-shadow:var(--shadow);
    transition:background 0.15s ease,color 0.15s ease;
  }
  header.topbar .brand:hover{
    background:var(--ink);
    color:var(--paper);
  }
  header.topbar .brand .sub{
    font-size:0.68rem;color:var(--ink-soft);font-weight:500;
    letter-spacing:0.03em;text-transform:uppercase;
  }
  header.topbar .brand:hover .sub{color:var(--paper);}
  header.topbar .brand.admin-compact-brand{
    display:inline-flex;
    width:250px;
    height:52px;
    padding:0 16px;
    align-items:center;
    justify-content:center;
    gap:7px;
    box-sizing:border-box;
    border:1px solid var(--ink);
    border-radius:7px;
    background:var(--card);
    box-shadow:var(--shadow);
    white-space:nowrap;
    font-size:0.92rem;
  }
  header.topbar .brand.admin-compact-brand .sub{
    font-size:0.62rem;
  }

  .crumb{
    font-size:0.78rem;color:var(--ink-soft);
    display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;
  }
  #authBox{
    display:flex !important;
    align-items:center;
    gap:7px;
    flex-wrap:nowrap;
    justify-content:flex-start;
    white-space:nowrap;
  }
  #authBox .top-user-email{
    display:inline-flex;
    align-items:center;
    border:1px solid var(--rail);
    background:var(--card);
    border-radius:8px;
    padding:9px 12px;
    color:var(--ink-soft);
    font-size:0.82rem;
  }
  #authBox .top-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:40px;
    border:1px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    border-radius:8px;
    padding:8px 12px;
    font-size:0.82rem;
    font-weight:600;
    text-decoration:none;
    box-shadow:var(--shadow);
    transition:background 0.15s ease,color 0.15s ease;
  }
  #authBox .top-action:hover{
    background:var(--ink);
    color:var(--paper);
  }
  #authBox .top-action-logout{
    border-color:var(--ink);
    background:var(--card);
    cursor:pointer;
  }
  @media (max-width:900px){
    header.topbar{
      padding:10px 18px;
      gap:8px;
    }
    header.topbar .brand{

    }
    #authBox{
      gap:6px;

    #authBox .top-action,

    }

    header.topbar{

    #authBox{

  .line-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:1.1rem;}

<script>
/* ============ DATA ============ */
let DATA = {};

/* ============ ROUTING ============ */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  return h ? h.split('/').filter(Boolean) : [];
}

function render(){
window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
  const parts = parseHash();
  const main = document.getElementById('main');
  const crumb = document.getElementById('crumb');
  const searchWrap = document.querySelector('.search-wrap');
  const authBox = document.getElementById('authBox');

  const isAuthPage = parts[0] === 'login' || parts[0] === 'signup';
  const topbar = document.querySelector('header.topbar');

  if(searchWrap) searchWrap.style.display = isAuthPage ? 'none' : 'block';
  if(authBox) authBox.style.display = isAuthPage ? 'none' : 'flex';

  if(topbar) topbar.style.display = isAuthPage ? 'none' : 'flex';

  // Admin/user application header only — do not affect guest/login pages.
  const brand = document.querySelector('header.topbar .brand');
  if(brand){
    const isAdminUser = currentUser &&
      ADMIN_EMAILS.includes((currentUser.email || '').toLowerCase());
    brand.classList.toggle('admin-compact-brand', !!isAdminUser);
}

  if(parts[0] === 'login'){ renderAuthPage('login'); return; }
  if(parts[0] === 'signup'){ renderAuthPage('signup'); return; }
  if(parts[0] === 'saved'){ renderSavedPaths(); return; }
  if(parts[0] === 'courses'){ renderCourseComparison(); return; }
  if(parts[0] === 'exams'){ renderEntranceExams(); return; }
if(parts[0] === 'institutions'){
  renderEducationFinder();
  return;
}
if(parts[0] === 'scholarships'){
  renderScholarshipFinder();
  return;
}
  if(parts[0] === 'recommend'){ renderRecommendations(); return; }

  if(parts[0] === 'analytics'){
    if(!currentUser){
      location.hash = '#/login';
      return;
    }
    if(!ADMIN_EMAILS.includes((currentUser.email || '').toLowerCase())){
      main.innerHTML = `
        <a class="back-link" href="#/">‹ Back to home</a>
        <p style="padding:20px;color:#A2402F;">You're not authorized to view analytics.</p>
      `;
      return;
    }
    renderAnalytics();
    return;
  }

  if(parts[0] === 'students'){
  renderStudentInterest();
  return;
}

if(parts[0] === 'profile'){
  renderProfile();
  return;
}

if(parts[0] === 'admin-saved'){
  if(!currentUser){
    location.hash = '#/login';
    return;
  }
  if(!ADMIN_EMAILS.includes((currentUser.email || '').toLowerCase())){
    main.innerHTML = `
      <a class="back-link" href="#/">‹ Back to home</a>
      <p style="padding:20px;color:#A2402F;">
        You're not authorized to view student saved paths.
      </p>
    `;
    return;
  }

  renderAdminSavedPaths();
  return;
}

  if(parts.length===0){ renderHome(main,crumb); return; }

  const streamId = parts[0];
  const stream = DATA[streamId];
  if(!stream){ renderHome(main,crumb); return; }

  if(parts.length===1){ renderStream(main,crumb,streamId,stream); return; }

  let node = stream.paths[parts[1]];
  let trail = [{label:stream.name, hash:streamId}];
  let idPath = streamId+'/'+parts[1];
  if(!node){ renderHome(main,crumb); return; }

  for(let i=2;i<parts.length;i++){
    trail.push({label:node.name, hash:idPath});
    if(node.children && node.children[parts[i]]){
      idPath += '/'+parts[i];
      node = node.children[parts[i]];
    } else {
      break;
    }
  }

  if(node.children){
    renderGroup(main,crumb,stream,idPath,node,trail);
  } else {
    renderLeaf(main,crumb,stream,idPath,node,trail);
  }
}

function setCrumb(crumb, trail){
  crumb.innerHTML = trail.map((t,i)=>{
    return `<a href="#/${t.hash}">${t.label}</a>` + (i<trail.length-1?' <span>›</span>':'');
  }).join(' ');
}


/* ============ COURSE COMPARISON + ENTRANCE EXAMS ============ */

/*
 * COURSE COMPARISON
 *
 * The comparison list is generated from DATA loaded from the backend.
 * This means every stream and every final career/course path returned by
 * /api/streams/full/all is available here automatically.
 *
 * We do NOT keep a small hard-coded list of courses anymore.
 */

function buildCourseComparisonData(){
  const options = [];

  for(const [streamId, stream] of Object.entries(DATA || {})){
    if(!stream) continue;

    // Add the stream itself as a comparison option.
    options.push({
      id: `stream:${streamId}`,
      name: stream.name || streamId,
      type: 'stream',
      stream: stream.name || streamId,
      duration: stream.duration || stream.courseDuration || 'Varies by course',
      entrance: stream.entrance || 'See individual course/path',
      focus: stream.desc || stream.full || 'Career stream after 10th',
      careers: Array.isArray(stream.afterCompletion)
        ? stream.afterCompletion.join(', ')
        : 'See individual career paths',
      skills: 'See individual course/path requirements',
      color: stream.color || 'var(--ink)',
      streamId
    });

    // Recursively collect every final/leaf course or career path.
    function walk(node, pathIds, breadcrumb){
      if(!node || typeof node !== 'object') return;

      const currentName = node.name || pathIds[pathIds.length - 1] || 'Course';
      const currentBreadcrumb = breadcrumb.concat(currentName);

      if(node.children && typeof node.children === 'object' &&
         Object.keys(node.children).length > 0){

        for(const [childId, child] of Object.entries(node.children)){
          walk(child, pathIds.concat(childId), currentBreadcrumb);
        }
        return;
      }

      const id = `course:${streamId}/${pathIds.join('/')}`;

      options.push({
        id,
        name: currentName,
        type: 'course',
        stream: stream.name || streamId,
        breadcrumb: currentBreadcrumb.join(' → '),
        duration:
          node.duration ||
          node.courseDuration ||
          node.durationYears ||
          'Not specified',
        entrance:
          node.entrance ||
          'See current admission notification',
        focus:
          node.focus ||
          node.desc ||
          (Array.isArray(node.coreSubjects)
            ? node.coreSubjects.join(', ')
            : 'Not specified'),
        careers:
          Array.isArray(node.jobRoles) && node.jobRoles.length
            ? node.jobRoles.join(', ')
            : 'Not specified',
        skills:
          Array.isArray(node.skills) && node.skills.length
            ? node.skills.join(', ')
            : 'Not specified',
        higherStudies:
          Array.isArray(node.higherStudies) && node.higherStudies.length
            ? node.higherStudies.join(', ')
            : '',
	salary: node.salary || null,
        color: stream.color || 'var(--ink)',
        streamId,
        pathId: pathIds[0] || null,
        nodeId: pathIds.slice(1).join('/') || null
      });
    }

    for(const [pathId, path] of Object.entries(stream.paths || {})){
      walk(path, [pathId], [stream.name || streamId]);
    }
  }

  return options;
}

function renderCourseComparison(){
  const main = document.getElementById('main');
  const crumb = document.getElementById('crumb');

  setCrumb(crumb, [{label:'Compare Courses', hash:'courses'}]);

  /*
   * Stream -> Course 1 -> Course 2
   * Course 1 and Course 2 are always taken from the
   * currently selected stream.
   */
  const coursesByStream = {};

  function collectCourses(streamId, stream, node, pathIds, breadcrumb){
    if(!node || typeof node !== 'object') return;

    const name =
      node.name ||
      pathIds[pathIds.length - 1] ||
      'Course';

    const trail = breadcrumb.concat(name);

    if(
      node.children &&
      typeof node.children === 'object' &&
      Object.keys(node.children).length > 0
    ){
      for(const [childId, child] of Object.entries(node.children)){
        collectCourses(
          streamId,
          stream,
          child,
          pathIds.concat(childId),
          trail
        );
      }
      return;
    }

    if(!coursesByStream[streamId]){
      coursesByStream[streamId] = {
        id: streamId,
        name: stream.name || streamId,
        courses: []
      };
    }

    coursesByStream[streamId].courses.push({
      id: `${streamId}/${pathIds.join('/')}`,
      name: name,
      stream: stream.name || streamId,
      streamId: streamId,
      breadcrumb: trail.slice(1).join(' → '),

      duration:
        node.duration ||
        node.courseDuration ||
        node.durationYears ||
        'Not specified',

      entrance:
        node.entrance ||
        'See current admission notification',

      focus:
        node.focus ||
        node.desc ||
        (
          Array.isArray(node.coreSubjects)
            ? node.coreSubjects.join(', ')
            : 'Not specified'
        ),

      careers:
        Array.isArray(node.jobRoles) && node.jobRoles.length
          ? node.jobRoles.join(', ')
          : 'Not specified',

      skills:
        Array.isArray(node.skills) && node.skills.length
          ? node.skills.join(', ')
          : 'Not specified',

      higherStudies:
        Array.isArray(node.higherStudies) && node.higherStudies.length
          ? node.higherStudies.join(', ')
          : 'Not specified',
	salary: node.salary || null,
    });
  }





  for(const [streamId, stream] of Object.entries(DATA || {})){
    if(!stream) continue;

    for(const [pathId, pathNode] of Object.entries(stream.paths || {})){
      collectCourses(
        streamId,
        stream,
        pathNode,
        [pathId],
        [stream.name || streamId]
      );
    }
  }

  const streamList = Object.values(coursesByStream);

  if(!streamList.length){
    main.innerHTML = `
      <a class="back-link" href="#/">‹ Back to home</a>
      <div class="page-head">
        <div class="code">CAREER TOOLS</div>
        <h1>Compare Courses</h1>
        <p>No courses are currently available.</p>
      </div>
    `;
    return;
  }

  const escapeHtml = value =>
    String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');

  main.innerHTML = `
    <a class="back-link" href="#/">‹ Back to home</a>

    <div class="page-head">
      <div class="code">CAREER TOOLS</div>
      <h1>Compare Courses</h1>

        Select a stream first, then choose any two courses
        from that same stream.
      </p>
    </div>

    <div style="
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-bottom:18px;
    ">

      <label style="

        font-weight:600;
      ">
        Stream

        <select id="compareStream" style="

        "></select>

      <label style="

      ">
        Course 1

        <select id="compareCourse1" style="

      <label style="

        Course 2

        <select id="compareCourse2" style="

    <div id="comparisonTable"></div>
  `;

  const streamSelect = document.getElementById('compareStream');

  const course2Select = document.getElementById('compareCourse2');
  const compareInfo = document.getElementById('compareInfo');

  function getSelectedStream(){
    return coursesByStream[streamSelect.value] || {
      id: streamSelect.value,
      name: streamSelect.value,
      courses: []
    };
  }

  function populateCourses(){
    const selectedStream = getSelectedStream();
    const courses = selectedStream.courses || [];

    compareInfo.innerHTML = `
      <strong>${escapeHtml(selectedStream.name)}</strong>
      — ${courses.length} course/career path${courses.length === 1 ? '' : 's'} available.
      ${courses.length >= 2
        ? ' Choose any two courses from this stream.'
        : ' At least two courses are required for comparison.'}
    `;

    if(courses.length < 2){
      course1Select.innerHTML = courses.length
        ? `<option value="${escapeHtml(courses[0].id)}">${escapeHtml(courses[0].name)}</option>`
        : `<option value="">No courses available</option>`;

      course2Select.innerHTML =
        `<option value="">No second course available</option>`;

      course1Select.disabled = courses.length === 0;
      course2Select.disabled = true;
      comparisonTable.innerHTML = '';
      return;
    }

    course1Select.disabled = false;
    course2Select.disabled = false;

    course1Select.innerHTML = courses.map((course,index) => `

        ${escapeHtml(course.name)}

        margin-top:10px;

        Both courses belong to the selected stream.
        Verify current admission requirements before applying.

    `;
  }

  streamSelect.addEventListener('change', populateCourses);
  course1Select.addEventListener('change', renderComparison);
  course2Select.addEventListener('change', renderComparison);

  populateCourses();

  const resultsBox = document.getElementById('institutionResults');
  const paginationBox = document.getElementById('institutionPagination');

  let currentPage = 1;
  const limit = 20;

  async function loadInstitutions(page = 1){

    currentPage = page;

    resultsBox.innerHTML = `
      <div class="detail-section">
        Loading institutions...
      </div>
    `;

    paginationBox.innerHTML = '';

    const params = new URLSearchParams();

    if(searchInput.value.trim()){
      params.set('search', searchInput.value.trim());
    }

    if(stateInput.value.trim()){
      params.set('state', stateInput.value.trim());
    }

    if(districtInput.value.trim()){
      params.set('district', districtInput.value.trim());
    }

    if(typeInput.value.trim()){
      params.set('institution_type', typeInput.value.trim());
    }
if(universityInput.value.trim()){
  params.set('university', universityInput.value.trim());
}

    params.set('page', page);
    params.set('limit', limit);

    try {

      const response = await fetch(
        `${API_BASE}/api/institutions?${params.toString()}`
      );

      if(!response.ok){
        throw new Error(`Server returned ${response.status}`);
      }

      const data = await response.json();

      if(!data.items || data.items.length === 0){
        resultsBox.innerHTML = `
          <div class="detail-section">
            No institutions found.
          </div>
        `;
        return;
      }

      resultsBox.innerHTML = `
        <div style="margin-bottom:12px;color:#666;">
          Showing ${((data.page - 1) * data.limit) + 1}
          -
          ${Math.min(data.page * data.limit, data.total)}
          of ${data.total.toLocaleString()} institutions
        </div>

        ${data.items.map(institution => `
          <div class="detail-section" style="margin-bottom:12px;">

            <h3 style="margin:0 0 8px;">
              ${escapeHtml(institution.name || 'Unnamed Institution')}

            <div style="font-size:14px;line-height:1.7;">

              <div>
                <strong>State:</strong>
                ${escapeHtml(institution.state || 'Not available')}
              </div>

              <div>
                <strong>District:</strong>
                ${escapeHtml(institution.district || 'Not available')}
              </div>

              <div>
                <strong>Type:</strong>
                ${escapeHtml(institution.institution_type || 'Not available')}
              </div>

              <div>
                <strong>University:</strong>
                ${escapeHtml(institution.university || 'Not available')}
              </div>

              ${
                institution.website
                  ? `
                    <div style="margin-top:8px;">
                      <a
                        href="${institution.website.startsWith('http') ? institution.website : 'https://' + institution.website}"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        Visit Website
                      </a>
                    </div>
                  `
                  : ''
              }

            </div>

          </div>
        `).join('')}
      `;

      const totalPages = Math.ceil(data.total / data.limit);

      if(totalPages > 1){

        let buttons = '';

        if(currentPage > 1){
          buttons += `
            <button
              class="btn"
              id="institutionPrevBtn"
            >
              ← Previous
            </button>
          `;
        }

        buttons += `
          <span style="margin:0 12px;">
            Page ${currentPage} of ${totalPages}
          </span>
        `;

        if(currentPage < totalPages){
          buttons += `
            <button
              class="btn"
              id="institutionNextBtn"
            >
              Next →
            </button>
          `;
        }

        paginationBox.innerHTML = buttons;

        const prevBtn =
          document.getElementById('institutionPrevBtn');

        const nextBtn =
          document.getElementById('institutionNextBtn');

        if(prevBtn){
          prevBtn.addEventListener(
            'click',
            () => loadInstitutions(currentPage - 1)
          );
        }

        if(nextBtn){
          nextBtn.addEventListener(
            'click',
            () => loadInstitutions(currentPage + 1)
          );
        }
      }

    } catch(error){

      console.error(error);

      resultsBox.innerHTML = `
        <div class="detail-section" style="--lc:#A2402F;">
          Unable to load institutions.
          Please try again.
        </div>
      `;
    }
  }

  searchBtn.addEventListener(
    'click',
    () => loadInstitutions(1)
  );

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    stateInput.value = '';
    districtInput.value = '';
    typeInput.value = '';
universityInput.value = '';

    loadInstitutions(1);
  });

  await loadInstitutions(1);
}

async function findScholarships(){

  const level =
    document.getElementById('scholarshipLevel').value;

  const state =
    document.getElementById('scholarshipState').value;

  const percentage =
    Number(document.getElementById('scholarshipPercentage').value || 0);

  const income =
    Number(document.getElementById('scholarshipIncome').value || 0);

  const category =
    document.getElementById('scholarshipCategory').value;

  const results =
    document.getElementById('scholarshipResults');


  if(!level || !state || !percentage || !income || !category){

    results.innerHTML = `
      <div class="detail-section" style="--lc:#A2402F;">
        <strong>Please complete all fields.</strong>
      </div>
    `;

    return;
  }


  results.innerHTML = `
    <div class="detail-section">
      Loading scholarships...
    </div>
  `;


  try {

    const response = await fetch(
      `${API_BASE}/api/scholarships`
    );

    if(!response.ok){
      throw new Error('Failed to load scholarships');
    }

    const data = await response.json();

    const scholarships = data.scholarships || [];


    const matches = scholarships.filter(scholarship => {

      /*
       * Education level matching
       */
      const educationLevels =
        scholarship.education_levels || [];

      let levelMatch = false;

      if(level === 'after10'){
        levelMatch =
          educationLevels.some(
            x => x.toLowerCase().includes('diploma')
          );
      }

      else if(level === 'degree'){
        levelMatch =
          educationLevels.some(
            x =>
              x.toLowerCase().includes('degree') ||
              x.toLowerCase().includes('undergraduate')
          );
      }

      else if(level === 'intermediate'){
        levelMatch = false;
      }

      else if(level === 'postgraduate'){
        levelMatch = false;
      }


      /*
       * State matching
       *
       * Most of the current dataset is AICTE/India-wide.
       * PM-USP is specifically for J&K and Ladakh.
       */
      let stateMatch = true;

      const eligibleRegions =
        scholarship.eligible_regions || [];

      if(eligibleRegions.length > 0){

        if(state === 'all-india'){
          stateMatch = false;
        }

        else if(state === 'andhra-pradesh'){
          stateMatch =
            eligibleRegions.some(
              x => x.toLowerCase().includes('andhra')
            );
        }

        else if(state === 'telangana'){
          stateMatch =
            eligibleRegions.some(
              x => x.toLowerCase().includes('telangana')
            );
        }

        else if(state === 'karnataka'){
          stateMatch =
            eligibleRegions.some(
              x => x.toLowerCase().includes('karnataka')
            );
        }

        else if(state === 'tamil-nadu'){
          stateMatch =
            eligibleRegions.some(
              x => x.toLowerCase().includes('tamil')
            );
        }
      }


      /*
       * Income matching
       */
      let incomeMatch = true;

      if(
        scholarship.family_income_limit !== undefined &&
        scholarship.family_income_limit !== null
      ){
        incomeMatch =
          income <= scholarship.family_income_limit;
      }


      /*
       * Category matching
       *
       * Current source documents do not provide
       * category-specific eligibility for most records.
       * Therefore we do not reject a scholarship
       * simply because the selected category is General/SC/ST/OBC/etc.
       */
      const categoryMatch = true;


      return (
        levelMatch &&
        stateMatch &&
        incomeMatch &&
        categoryMatch
      );

    });


    if(!matches.length){

      results.innerHTML = `
        <div class="detail-section">
          <h2>No matching scholarships found</h2>

            matches the selected education level, state and
            income criteria.

        </div>
      `;

      return;
    }


    results.innerHTML = `
      <div style="margin-bottom:16px;">
        <strong>
          ${matches.length} scholarship${matches.length === 1 ? '' : 's'} found
        </strong>
      </div>

      ${matches.map(scholarship => {

        const amount =
          scholarship.amount_per_year
            ? `₹${Number(
                scholarship.amount_per_year
              ).toLocaleString('en-IN')} per year`
            : scholarship.maintenance_allowance_per_year
              ? `Maintenance allowance: ₹${Number(
                  scholarship.maintenance_allowance_per_year
                ).toLocaleString('en-IN')} per year`
              : 'See official scheme details';


        const incomeLimit =
          scholarship.family_income_limit
            ? `₹${Number(
                scholarship.family_income_limit
              ).toLocaleString('en-IN')} per year`
            : 'Not specified';


        const education =
          (scholarship.education_levels || []).join(', ');


        const provider =
          scholarship.provider || 'Government / Institution';


        const portal =
          scholarship.application_portal ||
          'Check official scholarship portal';


        return `

          <div class="detail-section" style="margin-bottom:16px;">

            <h2 style="margin-bottom:8px;">
              ${scholarship.name}
            </h2>

            <p>
              <strong>Provider:</strong>
              ${provider}
            </p>

            <p>
              <strong>Education:</strong>
              ${education}
            </p>

            <p>
              <strong>Benefit:</strong>
              ${amount}
            </p>

            <p>
              <strong>Family income limit:</strong>
              ${incomeLimit}
            </p>

            <p>
              <strong>Application:</strong>
              ${portal}
            </p>

            ${
              scholarship.renewal_required
                ? `<p><strong>Renewal:</strong> Required</p>`
                : ''
            }

            <details style="margin-top:12px;">
              <summary style="cursor:pointer;font-weight:600;">
                View eligibility details
              </summary>

              <div style="margin-top:12px;">

                ${

                    ? `

                }

                      <p>

                    `

                }

                ${

                      <p>
                        <strong>Eligible regions:</strong>
                        ${scholarship.eligible_regions.join(', ')}
                      </p>
                    `
                    : ''
                }

              </div>
            </details>

          </div>

        `;

      }).join('')}
    `;


  } catch(error) {

    console.error(error);

      <div class="detail-section" style="--lc:#A2402F;">

}

async function trackClick(streamId, pathId, nodeId){
  try {
    const headers = {'Content-Type': 'application/json'};
    if(currentUser){
      const token = await currentUser.getIdToken();
      headers['Authorization'] = `Bearer ${token}`;
    }
    fetch(`${API_BASE}/api/track`, {
      method: 'POST',
      headers,
      body: JSON.stringify({ stream_id: streamId, path_id: pathId || null, node_id: nodeId || null })
    }).catch(err => console.error('Tracking failed:', err));
  } catch(err){
    console.error('Tracking failed:', err);
  }
}

/* ============ SEARCH ============ */
function searchCareers(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];

  function walk(node, idPath, breadcrumb){
    const hay = [node.name || '', ...(node.jobRoles || [])].join(' ').toLowerCase();
    if(hay.includes(q)){
      results.push({ idPath, label: breadcrumb.join(' › '), matchedRole: (node.jobRoles||[]).find(r=>r.toLowerCase().includes(q)) });
    }
    if(node.children){
      for(const [cid, child] of Object.entries(node.children)){
        walk(child, idPath + '/' + cid, breadcrumb.concat([child.name]));
      }
    }
  }

  for(const [sid, stream] of Object.entries(DATA)){
    for(const [pid, path] of Object.entries(stream.paths || {})){
      walk(path, sid + '/' + pid, [stream.name, path.name]);
    }
  }

  return results.slice(0, 8);
}

function renderSearchResults(results){
  const box = document.getElementById('searchResults');
  if(results.length === 0){
    box.style.display = 'block';
    box.innerHTML = `<div style="padding:12px;color:#888;font-size:14px;">No matching career found. Try a different term.</div>`;
    return;
  }
  box.style.display = 'block';
  box.innerHTML = results.map(r => `
    <a href="#/${r.idPath}" class="search-result-item" style="display:block;padding:10px 14px;text-decoration:none;color:#222;border-bottom:1px solid #eee;">
      <div style="font-size:14px;">${r.label}</div>
      ${r.matchedRole ? `<div style="font-size:12px;color:#888;">Role: ${r.matchedRole}</div>` : ''}
    </a>
  `).join('');
}

                </a>

                <div style="
                  margin-top:5px;
                  font-size:0.76rem;
                  color:var(--ink-soft);
                ">
                  Stream: ${item.stream_id || '-'}
                  ${item.path_id
                    ? ` · Path: ${item.path_id}`
                    : ''
                  }
                  ${item.node_id
                    ? ` · Node: ${item.node_id}`
                    : ''
                  }
                </div>

                ${
                  item.created_at
                    ? `
                      <div style="
                        margin-top:3px;
                        font-size:0.72rem;
                        color:var(--ink-soft);
                      ">
                        Saved: ${new Date(
                          item.created_at
                        ).toLocaleString()}
                      </div>
                    `
                    : ''
                }

              </div>

            </li>
          `;
        }
      }

      html += `
          </ul>

        </div>
      `;
    }

    main.innerHTML = html;

  } catch(err){

    console.error(
      'Failed to load admin saved paths:',
      err
    );

    main.innerHTML = `
      <a class="back-link" href="#/">‹ Back to home</a>

      <h1>Student Saved Paths</h1>

      <div style="
        padding:20px;
        margin-top:15px;
        background:#f8e5e1;
        border:1px solid #A2402F;
        border-radius:8px;
        color:#A2402F;
      ">
        <strong>Could not load student saved paths.</strong>

        <div style="margin-top:8px;font-size:0.85rem;">
          ${err.message}
        </div>
      </div>
    `;
  }
}
async function renderSavedPaths(){
  const main = document.getElementById('main');
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';

  if(!currentUser){
    location.hash = '#/login';
    return;
  }

  main.innerHTML = '<p style="padding:20px;">Loading your saved paths…</p>';
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch(`${API_BASE}/api/saved-paths`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if(!res.ok) throw new Error(`Server returned ${res.status}`);
    const items = await res.json();
    if(items.length === 0){
      main.innerHTML = `
        <a class="back-link" href="#/">‹ Back to home</a>
        <h1>My saved paths</h1>
        <p style="padding:12px 0;color:var(--ink-soft);">No saved paths yet. Explore a stream and tap "Save this path" on any final page.</p>
      `;
      return;
    }
    main.innerHTML = `
      <a class="back-link" href="#/">‹ Back to home</a>
      <h1>My saved paths</h1>
      <ul class="saved-list" id="savedPathsList">
        ${items.map(it => {
          const hash = [it.stream_id, it.path_id, it.node_id].filter(Boolean).join('/');
          return `<li class="saved-item" data-id="${it.id}">
            <a href="#/${hash}">${it.label || hash}</a>
            <button class="removeSavedBtn btn btn-plain btn-danger" data-id="${it.id}">Remove</button>
          </li>`;
        }).join('')}
      </ul>
    `;

    document.querySelectorAll('.removeSavedBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        btn.disabled = true;
        btn.textContent = 'Removing…';
        try {
          const token = await currentUser.getIdToken();
          const res = await fetch(`${API_BASE}/api/saved-paths/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if(!res.ok) throw new Error(`Server returned ${res.status}`);
          const li = document.querySelector(`li[data-id="${id}"]`);
          li.remove();
          const list = document.getElementById('savedPathsList');
          if(list.children.length === 0){
            main.innerHTML = '<a class="back-link" href="#/">‹ Back to home</a><p style="padding:20px;">No saved paths yet. Explore a stream and tap "Save this path" on any final page.</p>';
          }
        } catch(err){
          btn.disabled = false;
          btn.textContent = 'Remove';
          alert('Could not remove — try again.');
          console.error(err);
        }
      });
    });
  } catch(err){
    main.innerHTML = `<p style="padding:20px;color:#c00;">Could not load saved paths: ${err.message}</p>`;
  }
}

/* ============ LOAD DATA FROM BACKEND ============ */
// Change this to your deployed API URL once you deploy (e.g. Azure Container Apps URL).
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
//const API_BASE = 'http://127.0.0.1:8000';
const API_BASE = 'https://career-hub-backend-i960.onrender.com';

async function loadDataAndRender(){
  const main = document.getElementById('main');
  main.innerHTML = '<p style="padding:40px;text-align:center;">Checking login…</p>';

  // Wait for Firebase to report whether the user is already logged in
  // (e.g. from a previous session) before deciding what to show.
  await authReady;

  const parts = parseHash();
  const alreadyOnAuthPage = parts[0] === 'login' || parts[0] === 'signup';

  if(!currentUser && !alreadyOnAuthPage){
    location.hash = '#/login';
    return; // hashchange will trigger render() → renderAuthPage
  }

  if(alreadyOnAuthPage){
    render();
    return; // no career data needed just to show the login/signup page
  }

  main.innerHTML = '<p style="padding:40px;text-align:center;">Loading career data…</p>';
  try {
    const res = await fetch(`${API_BASE}/api/streams/full/all`);
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    DATA = await res.json();
    render();
  } catch (err) {
    main.innerHTML = `<p style="padding:40px;text-align:center;color:#c00;">
      Could not load career data from the server.<br>
      Make sure the backend is running at ${API_BASE}.<br>
      <small>${err.message}</small>
    </p>`;
    console.error('Failed to load DATA from API:', err);
  }
}

// After login/signup succeeds, or when navigating while already logged in,
// load career data if we don't have it yet.
window.addEventListener('hashchange', async () => {
  const parts = parseHash();
  const isAuthPage = parts[0] === 'login' || parts[0] === 'signup';
  if(!isAuthPage && Object.keys(DATA).length === 0){
    try {
      const res = await fetch(`${API_BASE}/api/streams/full/all`);
      if(res.ok) DATA = await res.json();
    } catch(err){ console.error(err); }
  }
  render();
});
window.addEventListener('DOMContentLoaded', loadDataAndRender);
</script>
